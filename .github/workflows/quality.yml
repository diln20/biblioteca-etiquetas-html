name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run loader smoke test
        run: node loader.smoke.test.cjs
      - name: Run HTML input types smoke test
        run: node html-input-types.smoke.test.cjs
      - name: Run HTML DOM properties smoke test
        run: node html-dom-element-properties.smoke.test.cjs
      - name: Run visual topics smoke test
        run: node visual-topics.smoke.test.cjs
      - name: Run modern frontend tools smoke test
        run: node modern-frontend-tools.smoke.test.cjs
      - name: Run JavaScript functions and Python-in-HTML smoke test
        run: node javascript-python-html.smoke.test.cjs
      - name: Run DOM selectors smoke test
        run: node dom-selectors.smoke.test.cjs
      - name: Run JavaScript PublicAPIs smoke test
        run: node javascript-publicapis.smoke.test.cjs
      - name: Run HTML CSS JavaScript cheat sheets smoke test
        run: node cheat-sheets.smoke.test.cjs
      - name: Run API JSON cheat sheet smoke test
        run: node api-json-cheat-sheet.smoke.test.cjs
      - name: Run API JSON HTML JavaScript smoke test
        run: node api-json-html-js.smoke.test.cjs
      - name: Run public API JSON practice smoke test
        run: node public-api-json-practice.smoke.test.cjs
      - name: Run VS Code tools smoke test
        run: node vscode-tools.smoke.test.cjs
      - name: Run personalized exercises smoke test
        run: node personalized-exercises.smoke.test.cjs
      - name: Run TypeScript category smoke test
        run: node typescript-category.smoke.test.cjs
      - name: Run framework category smoke test
        run: node framework-category.smoke.test.cjs
      - name: Run CDN usage smoke test
        run: node cdn-usage.smoke.test.cjs
      - name: Run backend category smoke test
        run: node backend-category.smoke.test.cjs
      - name: Run BaaS comparison smoke test
        run: node backend-baas.smoke.test.cjs
      - name: Run Fetch deploy ORM and defer smoke test
        run: node new-topics.smoke.test.cjs
      - name: Run Django Framework smoke test
        run: node django-framework-category.smoke.test.cjs
      - name: Run database category smoke test
        run: node database-category.smoke.test.cjs
      - name: Run browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/biblioteca-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-extensions \
            --window-size=1600,1200 \
            --virtual-time-budget=18000 \
            --dump-dom \
            'http://127.0.0.1:4173/index.html?ci-browser=1' \
            > /tmp/biblioteca-runtime.html

          nav_count=$(grep -o 'nav-item' /tmp/biblioteca-runtime.html | wc -l)
          exercise_count=$(grep -o 'data-personal-exercise="true"' /tmp/biblioteca-runtime.html | wc -l)
          typescript_count=$(grep -o 'data-group="TypeScript"' /tmp/biblioteca-runtime.html | wc -l)
          tools_count=$(grep -o 'data-group="Herramientas"' /tmp/biblioteca-runtime.html | wc -l)
          angular_count=$(grep -o 'data-group="Angular"' /tmp/biblioteca-runtime.html | wc -l)
          react_count=$(grep -o 'data-group="React"' /tmp/biblioteca-runtime.html | wc -l)
          django_framework_count=$(grep -o 'data-group="Django Framework"' /tmp/biblioteca-runtime.html | wc -l)
          fastapi_count=$(grep -o 'data-group="FastAPI"' /tmp/biblioteca-runtime.html | wc -l)
          django_count=$(grep -o 'data-group="Django REST"' /tmp/biblioteca-runtime.html | wc -l)
          database_count=$(grep -o 'data-group="Base de datos"' /tmp/biblioteca-runtime.html | wc -l)
          card_count=$(grep -o 'tag-card' /tmp/biblioteca-runtime.html | wc -l)
          first_nav_title=$(grep -o '<span class="nav-title">[^<]*</span>' /tmp/biblioteca-runtime.html | sed -n '1p')

          echo "Browser diagnostics: nav=${nav_count}; ejercicios=${exercise_count}; first=${first_nav_title}; TypeScript=${typescript_count}; Herramientas=${tools_count}; Angular=${angular_count}; React=${react_count}; DjangoFramework=${django_framework_count}; FastAPI=${fastapi_count}; DjangoREST=${django_count}; BasesDatos=${database_count}; tarjetas=${card_count}."

          grep -q 'RUTA DE APRENDIZAJE' /tmp/biblioteca-runtime.html
          grep -q 'data-group="TypeScript"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Herramientas"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Angular"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="React"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Vue"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Svelte"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Solid.js"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Django Framework"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="FastAPI"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Django REST"' /tmp/biblioteca-runtime.html
          grep -q 'data-group="Base de datos"' /tmp/biblioteca-runtime.html
          grep -q 'JWT, Cookies y Sessions' /tmp/biblioteca-runtime.html
          grep -q 'CORS, CSP y HTTPS' /tmp/biblioteca-runtime.html
          grep -q 'Redux, Zustand y Jotai' /tmp/biblioteca-runtime.html
          grep -q 'TanStack Query, Axios y Fetch' /tmp/biblioteca-runtime.html
          grep -q 'Tipos de funciones' /tmp/biblioteca-runtime.html
          grep -q 'Python en HTML · PyScript y Pyodide' /tmp/biblioteca-runtime.html
          grep -q 'DOM · Selectores' /tmp/biblioteca-runtime.html
          grep -q 'DOM · Propiedades y métodos' /tmp/biblioteca-runtime.html
          grep -q 'APIs públicas de PublicAPIs.io' /tmp/biblioteca-runtime.html
          grep -q 'HTML · Chuleta rápida' /tmp/biblioteca-runtime.html
          grep -q 'CSS · Chuleta rápida' /tmp/biblioteca-runtime.html
          grep -q 'JavaScript · Chuleta rápida' /tmp/biblioteca-runtime.html
          grep -q 'APIs · Chuleta JSON y datos' /tmp/biblioteca-runtime.html
          grep -q 'APIs · JSON con HTML y JavaScript' /tmp/biblioteca-runtime.html
          grep -q 'APIs · JSON de APIs públicas en práctica' /tmp/biblioteca-runtime.html
          grep -q 'Visual Studio Code desde cero' /tmp/biblioteca-runtime.html
          grep -q 'Prettier y ESLint' /tmp/biblioteca-runtime.html
          grep -q 'CDN y librerías' /tmp/biblioteca-runtime.html
          grep -q 'BaaS · Supabase vs Firebase vs Appwrite' /tmp/biblioteca-runtime.html
          grep -q 'Fetch API a fondo' /tmp/biblioteca-runtime.html
          grep -q 'Despliegue · Railway vs Render vs Fly.io' /tmp/biblioteca-runtime.html
          grep -q 'ORM Node.js · Prisma vs Sequelize vs Drizzle' /tmp/biblioteca-runtime.html
          grep -q 'Ejercicio para ti' /tmp/biblioteca-runtime.html
          grep -q 'Usa datos ficticios si vas a publicar el ejercicio' /tmp/biblioteca-runtime.html
          test "$first_nav_title" = '<span class="nav-title">01. Fundamentos web</span>'
          ! grep -q '<span class="nav-title">01. Imágenes · Atributos de img</span>' /tmp/biblioteca-runtime.html
          ! grep -q '<span class="nav-title">01. Tipos de input</span>' /tmp/biblioteca-runtime.html
          test "$nav_count" -ge 195
          test "$exercise_count" -ge 1
          test "$typescript_count" -ge 9
          test "$tools_count" -ge 4
          test "$angular_count" -ge 20
          test "$react_count" -ge 6
          test "$django_framework_count" -ge 5
          test "$fastapi_count" -ge 2
          test "$django_count" -ge 5
          test "$database_count" -ge 8
          test "$card_count" -ge 1
          ! grep -q '</sections.length-1)' /tmp/biblioteca-runtime.html

          echo "Browser smoke OK: ${nav_count} temas, ejercicios personalizados=${exercise_count}, Herramientas=${tools_count}, primero=${first_nav_title}, TypeScript=${typescript_count}, Angular=${angular_count}, React=${react_count}, DjangoFramework=${django_framework_count}, FastAPI=${fastapi_count}, DjangoREST=${django_count}, BasesDatos=${database_count}, tarjetas=${card_count}."
