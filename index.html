<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML5 Library · Biblioteca interactiva</title></head><body><noscript>Activa JavaScript para usar la biblioteca.</noscript><script src="payload-1.js"></script><script src="payload-2.js"></script><script src="payload-3.js"></script><script src="payload-4.js"></script><script src="payload-5.js"></script><script>(async()=>{try{const b=Uint8Array.from(atob(window.__HTML5_BUNDLE),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");let html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();const open=html.indexOf("<script>");const close=html.lastIndexOf("<\/script>");if(open>=0&&close>open){const start=open+8;const js=html.slice(start,close).replaceAll("<\/script>","<\\/script>");html=html.slice(0,start)+js+html.slice(close)}document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;font-family:system-ui;color:#b91c1c">No se pudo cargar la biblioteca HTML. Recarga la página.</pre>';console.error(e)}})();</script></body></html>
