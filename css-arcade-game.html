<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CSS Arcade: juegos interactivos para practicar CSS escribiendo código real.">
  <title>CSS Arcade · Juego interactivo</title>
  <link rel="stylesheet" href="css-arcade-game.css?v=1">
</head>
<body>
  <header class="arcade-topbar">
    <a href="index.html" class="back">← Biblioteca</a>
    <div>
      <strong id="gameName">CSS Arcade</strong>
      <span id="gameSubtitle">Practica CSS jugando</span>
    </div>
    <button id="resetProgress" class="ghost" type="button">Reiniciar progreso</button>
  </header>

  <main class="arcade-layout">
    <section class="mission-panel">
      <div class="mission-head">
        <div>
          <p id="levelCounter" class="eyebrow">Nivel 1</p>
          <h1 id="levelTitle">Cargando…</h1>
        </div>
        <div id="score" class="score">0/0</div>
      </div>

      <p id="instruction" class="instruction"></p>

      <div class="preview-grid">
        <section class="preview-card">
          <div class="preview-label"><span>Objetivo</span><small id="targetWidth"></small></div>
          <div class="preview-window"><iframe id="targetFrame" title="Resultado objetivo" tabindex="-1"></iframe></div>
        </section>
        <section class="preview-card">
          <div class="preview-label"><span>Tu resultado</span><small id="playerWidth"></small></div>
          <div class="preview-window"><iframe id="playerFrame" title="Tu resultado CSS"></iframe></div>
        </section>
      </div>

      <div id="feedback" class="feedback" role="status" aria-live="polite">Escribe CSS para acercar tu resultado al objetivo.</div>

      <div class="actions">
        <button id="checkBtn" class="primary" type="button">Comprobar</button>
        <button id="hintBtn" class="secondary" type="button">Pista</button>
        <button id="solutionBtn" class="secondary" type="button">Ver solución</button>
        <button id="resetLevelBtn" class="secondary" type="button">Limpiar nivel</button>
        <button id="nextBtn" class="primary" type="button" disabled>Siguiente →</button>
      </div>

      <div id="hintBox" class="help-box" hidden></div>
      <div id="solutionBox" class="help-box solution-box" hidden></div>
    </section>

    <aside class="editor-panel">
      <div class="editor-title">
        <div><i></i><i></i><i></i></div>
        <span>styles.css · editable</span>
      </div>
      <textarea id="cssEditor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Editor CSS"></textarea>
      <div class="editor-foot"><span>Ctrl + Enter = comprobar</span><span id="concepts"></span></div>
      <nav class="levels"><p>Niveles</p><div id="levelButtons"></div></nav>
    </aside>
  </main>

  <script src="css-arcade-game.js?v=2" defer></script>
</body>
</html>
